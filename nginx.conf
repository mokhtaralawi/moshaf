# ==============================================================
# NGINX Configuration for "زاد الأنصاري" (مشورة إب)
# Place in: /etc/nginx/sites-available/zad-alansari
# Symlink to: /etc/nginx/sites-enabled/
# ==============================================================

# Gzip Compression Settings
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# Upstream Node.js / PM2 Cluster
upstream app_cluster {
    server 127.0.0.1:3000;
    keepalive 64;
}

# -------------------------------------------------------------
# 1. HTTP Server (Redirect all traffic to HTTPS)
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # استبدل باسم نطاقك أو IP السيرفر

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (قم بتفعيلها بعد تثبيت شهادة SSL)
    # return 301 https://$host$request_uri;

    # في حال التشغيل المبدئي على HTTP بدون نطاق:
    location / {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

